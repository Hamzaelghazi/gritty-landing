<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sell your books faster with Gritty-ify. Get started in a minute.">
    <title>Get started — Gritty-ify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./ressources/css/all.min.css">
    <link rel="stylesheet" href="./ressources/css/contact.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./index.html"><span class="brand-mark">G</span> Gritty-ify</a>
    </header>

    <main class="wrap">
        <section class="card" role="region" aria-labelledby="s1-title">
            <h1 id="s1-title">Sell your books faster</h1>
            <p class="subtitle">Join Gritty-ify — enter your details to get started.</p>

            <form id="step1-form" novalidate>
                <label class="lbl" for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <p class="error" id="email-error" role="alert"></p>

                <button type="submit" class="btn" id="submit-btn">
                    <span class="btn-label">Continue with email</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>

            <p class="fineprint">
                By continuing, you agree to our <a href="#">Privacy Policy</a>. We collect the
                information you submit, plus basic technical data (device and approximate location),
                and will contact you by email.
            </p>
        </section>

        <footer class="legal">
            <span>&copy; <span id="year"></span> Gritty-ify</span>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </footer>
    </main>

    <script src="./ressources/js/meta.js"></script>
    <script src="./ressources/js/step1.js"></script>
</body>
</html>
